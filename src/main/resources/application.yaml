spring:
  application:
    name: springboot-sns-sample
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  session:
    data:
      redis:
        namespace: sns:session
        flush-mode: on-save
        # SessionRegistry(principal별 세션 조회)를 쓰려면 인덱스를 지원하는 indexed 저장소가 필요하다.
        repository-type: indexed

app:
  session:
    maximum-sessions: ${SESSION_MAX_SESSIONS:2}
    max-sessions-prevents-login: ${SESSION_MAX_PREVENTS_LOGIN:false}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
