spring:
  application:
    name: springboot-sns-sample
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sns}
    username: ${POSTGRES_USER:sns}
    password: ${POSTGRES_PASSWORD:sns}
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      # 기동 시마다 ddl.sql 실행 (IF NOT EXISTS 라서 재실행해도 안전). 이후 Hibernate가 스키마를 validate 한다.
      mode: always
      schema-locations: classpath:ddl.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  session:
    data:
      redis:
        namespace: sns:session
        flush-mode: on-save
        # SessionRegistry(principal별 세션 조회)를 쓰려면 인덱스를 지원하는 indexed 저장소가 필요하다.
        repository-type: indexed

app:
  session:
    maximum-sessions: ${SESSION_MAX_SESSIONS:2}
    max-sessions-prevents-login: ${SESSION_MAX_PREVENTS_LOGIN:false}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    org.springframework.jdbc.datasource.init.ScriptUtils: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
