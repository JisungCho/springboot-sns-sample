spring:
  application:
    name: springboot-sns-sample
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sns}
    username: ${POSTGRES_USER:sns}
    password: ${POSTGRES_PASSWORD:sns}
  jpa:
    hibernate:
      # 기동 시 엔티티와 DB 스키마를 비교해서 빠진 테이블/컬럼만 추가한다. 기존 데이터와 테이블은 건드리지 않는다.
      ddl-auto: update
    # sql.init(ddl.sql)을 Hibernate보다 먼저 실행해서, 스키마의 출처를 ddl.sql 하나로 둔다.
    # (true로 두면 Hibernate가 먼저 테이블을 만들어 ddl.sql의 CREATE TABLE이 no-op이 된다.)
    defer-datasource-initialization: false
    properties:
      hibernate:
        # 실행 SQL을 여러 줄로 정리해서 출력
        format_sql: true
        # 콘솔에 ANSI 색상으로 강조 출력 (IDE 콘솔에서 가독성 향상)
        highlight_sql: true
  sql:
    init:
      # 스키마의 단일 출처. Hibernate(update)보다 먼저 실행되어 테이블/부분 유니크 인덱스/조회 인덱스를 만든다.
      # JPA로는 부분 유니크 인덱스를 표현할 수 없어서 이 부분은 SQL로 관리한다.
      mode: always
      schema-locations: classpath:ddl.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  session:
    data:
      redis:
        namespace: sns:session
        flush-mode: on-save
        # SessionRegistry(principal별 세션 조회)를 쓰려면 인덱스를 지원하는 indexed 저장소가 필요하다.
        repository-type: indexed

app:
  session:
    maximum-sessions: ${SESSION_MAX_SESSIONS:2}
    max-sessions-prevents-login: ${SESSION_MAX_PREVENTS_LOGIN:false}
  post-view:
    # Redis에 모인 게시글 조회수를 DB로 옮기는 주기 (매분 0초). Spring cron은 초를 포함한 6필드다.
    flush-cron: ${POST_VIEW_FLUSH_CRON:0 * * * * *}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    org.springframework.jdbc.datasource.init.ScriptUtils: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    # 기동 시 Hibernate가 실제로 실행하는 DDL(create/drop)과 스키마 관련 로그를 확인
    org.hibernate.tool.schema: debug
